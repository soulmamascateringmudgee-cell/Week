document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0;}\n  body{background:#E7E8E1;font-family:\"Lato\",-apple-system,sans-serif;color:#3F4D3A;}\n  input,textarea,button,select{font-family:inherit;}\n  textarea{resize:vertical;}\n  a{color:#C46A4A;text-decoration:none;}\n  a:hover{color:#3F4D3A;}\n  ::placeholder{color:#9BA593;opacity:1;}\n  .fld{width:100%;background:#F2F1EB;border:1.5px solid #E0E2D8;border-radius:10px;padding:12px 15px;font-size:15px;color:#3F4D3A;outline:none;}\n  .lbl{font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.14em;color:#819174;margin-bottom:8px;}\n  .ref{background:#EEF1EA;border:1.5px solid #DDE1D6;border-radius:12px;padding:20px 22px;font-size:15px;line-height:1.7;color:#3F4D3A;white-space:pre-wrap;}\n  .sheet{position:relative;background:#FCFBF9;border:1px solid #E4E6DE;border-radius:16px;box-shadow:0 4px 30px rgba(63,77,58,.07);padding:52px 56px;margin-bottom:30px;}\n  .kicker{font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.2em;color:#819174;}\n  .h2{font-family:'Playfair Display';font-style:italic;font-size:29px;color:#3F4D3A;margin:6px 0 6px;}\n  .cpbtn{font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.1em;padding:9px 16px;border-radius:99px;border:1.5px solid #C46A4A;background:transparent;color:#C46A4A;cursor:pointer;}\n  @media print{\n    .no-print{display:none !important;}\n    body{background:#fff;}\n    .sheet{box-shadow:none !important;border:1px solid #E0E2D8 !important;break-inside:avoid;margin:0 auto 20px !important;}\n    .deck{padding:0 !important;}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"deck\" style=\"max-width:920px;margin:0 auto;padding:0 24px 100px;\">\n\n  <div class=\"no-print\" style=\"position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 18px;margin:0 -24px 28px;background:rgba(231,232,225,.9);backdrop-filter:blur(10px);border-bottom:1px solid #D5D8CD;\">\n    <img src=\"a46e4df7-5312-432c-8493-e20ee8978796\" alt=\"Country Smart AI\" style=\"width:38px;height:38px;object-fit:contain;flex:none;\">\n    <div style=\"font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.16em;color:#3F4D3A;white-space:nowrap;\">AI FOR REAL LIFE<\u002Fdiv>\n    <div style=\"flex:1;display:flex;align-items:center;gap:12px;min-width:0;\">\n      <div style=\"flex:1;height:8px;border-radius:99px;background:#D5D8CD;overflow:hidden;min-width:60px;\">\n        <div style=\"height:100%;border-radius:99px;transition:width .35s ease;background: {{ accentColor }};width: {{ progressWidth }};\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.08em;color:#819174;white-space:nowrap;\">{{ progressPct }}% DONE<\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ print }}\" style=\"flex:none;font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.1em;padding:9px 16px;border-radius:99px;border:1.5px solid #3F4D3A;background:transparent;color:#3F4D3A;cursor:pointer;\" style-hover=\"{&quot;background&quot;:&quot;#3F4D3A&quot;,&quot;color&quot;:&quot;#F6F6F4&quot;}\">PRINT / PDF<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ reset }}\" style=\"flex:none;font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.1em;padding:9px 14px;border-radius:99px;border:1.5px solid #D0BDB2;background:transparent;color:#B08160;cursor:pointer;\" style-hover=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;color&quot;:&quot;#C46A4A&quot;}\">RESET<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- COVER -->\n  <div class=\"sheet\" style=\"text-align:center;padding:70px 60px 60px;\">\n    <img src=\"a46e4df7-5312-432c-8493-e20ee8978796\" alt=\"Country Smart AI\" style=\"width:150px;height:150px;object-fit:contain;margin:0 auto 26px;display:block;\">\n    <div class=\"kicker\" style=\"letter-spacing:.32em;\">FREE PRACTICAL GUIDE · INTERACTIVE WORKBOOK<\u002Fdiv>\n    <h1 style=\"font-family:'Montserrat';font-weight:700;font-size:42px;line-height:1.1;color:#3F4D3A;margin:20px 0 0;text-transform:uppercase;\">AI for<br>Real Life<\u002Fh1>\n    <p style=\"font-family:'Playfair Display';font-style:italic;font-size:24px;color:#C46A4A;margin:14px 0 0;\">for busy women running everything<\u002Fp>\n    <p style=\"max-width:540px;margin:22px auto 0;font-size:16px;line-height:1.7;color:#5C6653;\">A practical guide for busy women who want to save time, reduce the mental load and get more done with AI. Work through it, fill it in, and finish with a handful of AI helpers you'll actually reuse.<\u002Fp>\n    <div style=\"font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.22em;color:#819174;margin-top:26px;\">SAVE TIME&nbsp;&nbsp;·&nbsp;&nbsp;GROW INCOME&nbsp;&nbsp;·&nbsp;&nbsp;LIGHTEN THE LOAD<\u002Fdiv>\n    <div style=\"display:flex;gap:18px;max-width:520px;margin:40px auto 0;text-align:left;\">\n      <label style=\"flex:2;\"><div class=\"lbl\">THIS WORKBOOK BELONGS TO<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"name\" value=\"{{ answers.name }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Your name\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n      <label style=\"flex:1;\"><div class=\"lbl\">DATE<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"date\" value=\"{{ answers.date }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"/ /\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n    <\u002Fdiv>\n    <p style=\"font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.1em;color:#C46A4A;margin-top:30px;\">START SMALL. FINISH SOMETHING USEFUL.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- 1 QUICK WIN -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">QUICK WIN<\u002Fdiv>\n    <h2 class=\"h2\">Get everything out of your head.<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;\">Open ChatGPT and give it the messy version. You don't need to organise your thoughts first. Copy this straight in.<\u002Fp>\n    <div class=\"ref\">I have a lot going on and I want you to help me organise it. I'm going to brain dump everything taking up space in my head. Don't start solving anything until I say DONE. When I do, sort it into: do today, do this week, can wait, delegate, and forget about. Then tell me the three things I should focus on first. Keep it simple because I'm already overwhelmed.<\u002Fdiv>\n    <button class=\"cpbtn no-print\" style=\"margin-top:14px;\" data-key=\"quickwin\" data-text=\"I have a lot going on and I want you to help me organise it. I'm going to brain dump everything taking up space in my head. Don't start solving anything until I say DONE. When I do, sort it into: do today, do this week, can wait, delegate, and forget about. Then tell me the three things I should focus on first. Keep it simple because I'm already overwhelmed.\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n    <label style=\"display:block;margin-top:26px;\"><div class=\"lbl\">WHAT DID AI HELP YOU SEE MORE CLEARLY?<\u002Fdiv><textarea class=\"fld\" style=\"min-height:70px;\" data-key=\"quickwin_reflection\" value=\"{{ answers.quickwin_reflection }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Write it down while it's fresh…\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n  <\u002Fdiv>\n\n  <!-- 2 SIMPLE FORMULA -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">THE SIMPLE FORMULA<\u002Fdiv>\n    <h2 class=\"h2\">Context + Task + Details + Result.<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin-bottom:24px;\">You don't need to write perfect prompts. Fill in the four parts for whatever's on your mind right now — your prompt builds itself.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <label style=\"display:block;\"><div class=\"lbl\">CONTEXT — what's happening?<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"formula_context\" value=\"{{ answers.formula_context }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. I run a farm-gate cafe near Mudgee\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">TASK — what do you want AI to do?<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"formula_task\" value=\"{{ answers.formula_task }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. plan five weeknight dinners\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">DETAILS — what does it need to know?<\u002Fdiv><textarea class=\"fld\" style=\"min-height:64px;\" data-key=\"formula_details\" value=\"{{ answers.formula_details }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. under 30 minutes, affordable, reuse ingredients\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">RESULT — what should the answer look like?<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"formula_result\" value=\"{{ answers.formula_result }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. one shopping list by supermarket section\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n      <\u002Fdiv>\n      <div>\n        <div class=\"lbl\">YOUR PROMPT<\u002Fdiv>\n        <div class=\"ref\" style=\"min-height:170px;\"><sc-if value=\"{{ hasFormula }}\" hint-placeholder-val=\"{{ true }}\">{{ builtFormula }}<\u002Fsc-if><sc-if value=\"{{ noFormula }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#9BA593;font-style:italic;\">Fill in the four parts and your prompt appears here.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <button class=\"cpbtn no-print\" style=\"margin-top:12px;width:100%;\" data-key=\"formula\" data-text=\"{{ builtFormula }}\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 3 ABOUT ME -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">MAKE IT PERSONAL<\u002Fdiv>\n    <h2 class=\"h2\">Create your About Me profile.<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin-bottom:24px;\">Give AI reusable context about your life so you don't repeat yourself every time. Fill these in once, copy the profile, and paste it at the start of any new chat.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;\">\n      <label style=\"display:block;\"><div class=\"lbl\">HOUSEHOLD &amp; FAMILY<\u002Fdiv><textarea class=\"fld\" style=\"min-height:64px;\" data-key=\"about_household\" value=\"{{ answers.about_household }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Who's in your household…\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n      <label style=\"display:block;\"><div class=\"lbl\">WORK &amp; WEEKLY COMMITMENTS<\u002Fdiv><textarea class=\"fld\" style=\"min-height:64px;\" data-key=\"about_work\" value=\"{{ answers.about_work }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"What fills your week…\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n      <label style=\"display:block;\"><div class=\"lbl\">GOALS<\u002Fdiv><textarea class=\"fld\" style=\"min-height:64px;\" data-key=\"about_goals\" value=\"{{ answers.about_goals }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"What you're working towards…\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n      <label style=\"display:block;\"><div class=\"lbl\">BIGGEST TIME PRESSURES<\u002Fdiv><textarea class=\"fld\" style=\"min-height:64px;\" data-key=\"about_pressures\" value=\"{{ answers.about_pressures }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"What's stretching you thin…\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n    <\u002Fdiv>\n    <label style=\"display:block;margin-top:18px;\"><div class=\"lbl\">HOW YOU LIKE INFORMATION PRESENTED (+ THINGS YOU HATE DOING)<\u002Fdiv><textarea class=\"fld\" style=\"min-height:60px;\" data-key=\"about_prefs\" value=\"{{ answers.about_prefs }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Short lists? Plain English? No fluff?\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n    <div class=\"lbl\" style=\"margin-top:22px;\">YOUR PROFILE<\u002Fdiv>\n    <div class=\"ref\"><sc-if value=\"{{ hasAboutMe }}\" hint-placeholder-val=\"{{ true }}\">{{ builtAboutMe }}<\u002Fsc-if><sc-if value=\"{{ noAboutMe }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#9BA593;font-style:italic;\">Fill in the sections above to build your reusable profile.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n    <button class=\"cpbtn no-print\" style=\"margin-top:12px;\" data-key=\"aboutme\" data-text=\"{{ builtAboutMe }}\" sc-camel-on-click=\"{{ copyText }}\">COPY PROFILE<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- 4 MENTAL LOAD -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">MENTAL LOAD RESCUE<\u002Fdiv>\n    <h2 class=\"h2\">Dump first. Organise second.<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;\">Your brain is for thinking, not storing every open loop. Copy this in, brain dump everything, then say DONE.<\u002Fp>\n    <div class=\"ref\">My brain feels overloaded. I'm going to brain dump work, home, family, appointments, things to buy, people to contact and anything I'm worried I'll forget. Don't organise anything until I say DONE. Then sort it, flag urgent items, give me today's realistic list, move the rest into this week / later / delegate / delete, and tell me where AI could help.<\u002Fdiv>\n    <button class=\"cpbtn no-print\" style=\"margin-top:14px;\" data-key=\"mentalload\" data-text=\"My brain feels overloaded. I'm going to brain dump work, home, family, appointments, things to buy, people to contact and anything I'm worried I'll forget. Don't organise anything until I say DONE. Then sort it, flag urgent items, give me today's realistic list, move the rest into this week / later / delegate / delete, and tell me where AI could help.\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n    <div class=\"lbl\" style=\"margin-top:26px;\">MY THREE THINGS THAT MATTER TODAY<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;\">\n      <input type=\"text\" class=\"fld\" data-key=\"priority1\" value=\"{{ answers.priority1 }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"1.\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n      <input type=\"text\" class=\"fld\" data-key=\"priority2\" value=\"{{ answers.priority2 }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"2.\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n      <input type=\"text\" class=\"fld\" data-key=\"priority3\" value=\"{{ answers.priority3 }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"3.\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 5 HOME LIFE -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">MAKE HOME LIFE EASIER<\u002Fdiv>\n    <h2 class=\"h2\">5:17pm. What the hell is for dinner?<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin-bottom:20px;\">Give AI the reality — who you're feeding, what you have, how much time and effort. Fill in the blanks below.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;\">\n      <label style=\"display:block;\"><div class=\"lbl\">ADULTS<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"dinner_adults\" value=\"{{ answers.dinner_adults }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. 2\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n      <label style=\"display:block;\"><div class=\"lbl\">CHILDREN<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"dinner_children\" value=\"{{ answers.dinner_children }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. 2\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n      <label style=\"display:block;\"><div class=\"lbl\">TIME TO COOK<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"dinner_time\" value=\"{{ answers.dinner_time }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. 30 min\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;\">\n      <label style=\"display:block;\"><div class=\"lbl\">INGREDIENTS I ALREADY HAVE<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"dinner_ingredients\" value=\"{{ answers.dinner_ingredients }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. chicken thighs, carrots\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n      <label style=\"display:block;\"><div class=\"lbl\">DIETARY NEEDS / FOODS NOBODY WILL EAT<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"dinner_dietary\" value=\"{{ answers.dinner_dietary }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. no seafood\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n    <\u002Fdiv>\n    <label style=\"display:block;margin-top:14px;max-width:280px;\"><div class=\"lbl\">EFFORT LEVEL<\u002Fdiv>\n      <sc-raw-select class=\"fld\" data-key=\"dinner_effort\" value=\"{{ answers.dinner_effort }}\" sc-camel-on-change=\"{{ onText }}\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n        <option value=\"low\">Low<\u002Foption><option value=\"medium\">Medium<\u002Foption><option value=\"ambitious\">Ambitious<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Flabel>\n    <div class=\"lbl\" style=\"margin-top:22px;\">YOUR PROMPT<\u002Fdiv>\n    <div class=\"ref\"><sc-if value=\"{{ hasDinner }}\" hint-placeholder-val=\"{{ true }}\">{{ builtDinner }}<\u002Fsc-if><sc-if value=\"{{ noDinner }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#9BA593;font-style:italic;\">Fill in at least one field above.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n    <button class=\"cpbtn no-print\" style=\"margin-top:12px;\" data-key=\"dinner\" data-text=\"{{ builtDinner }}\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n    <div style=\"margin-top:28px;padding-top:24px;border-top:1px solid #E4E6DE;\">\n      <div class=\"kicker\">HOUSE RESET<\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin:6px 0 14px;\">Ask AI for a realistic plan, not your fantasy productive life.<\u002Fp>\n      <div class=\"ref\">People are coming over in 30 minutes. The main areas they'll see are the kitchen, lounge, bathroom and entry. Give me a timed 30-minute reset. Prioritise the biggest visual difference. Ignore jobs nobody will notice. Do not include deep cleaning.<\u002Fdiv>\n      <button class=\"cpbtn no-print\" style=\"margin-top:14px;\" data-key=\"housereset\" data-text=\"People are coming over in 30 minutes. The main areas they'll see are the kitchen, lounge, bathroom and entry. Give me a timed 30-minute reset. Prioritise the biggest visual difference. Ignore jobs nobody will notice. Do not include deep cleaning.\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 6 WORK ASSISTANT -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">YOUR AI WORK ASSISTANT<\u002Fdiv>\n    <h2 class=\"h2\">Stop staring at the blinking cursor.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start;margin-top:20px;\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <label style=\"display:block;\"><div class=\"lbl\">SITUATION<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"email_situation\" value=\"{{ answers.email_situation }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"What's happening?\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">RECIPIENT<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"email_recipient\" value=\"{{ answers.email_recipient }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Who are they?\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">OUTCOME I NEED<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"email_outcome\" value=\"{{ answers.email_outcome }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"The result you want\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;max-width:220px;\"><div class=\"lbl\">TONE<\u002Fdiv>\n          <sc-raw-select class=\"fld\" data-key=\"email_tone\" value=\"{{ answers.email_tone }}\" sc-camel-on-change=\"{{ onText }}\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n            <option value=\"warm\">Warm<\u002Foption><option value=\"professional\">Professional<\u002Foption><option value=\"firm\">Firm<\u002Foption><option value=\"concise\">Concise<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">IMPORTANT DETAILS<\u002Fdiv><textarea class=\"fld\" style=\"min-height:60px;\" data-key=\"email_details\" value=\"{{ answers.email_details }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Anything it needs to know\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n      <\u002Fdiv>\n      <div>\n        <div class=\"lbl\">YOUR PROMPT<\u002Fdiv>\n        <div class=\"ref\" style=\"min-height:170px;\"><sc-if value=\"{{ hasEmail }}\" hint-placeholder-val=\"{{ true }}\">{{ builtEmail }}<\u002Fsc-if><sc-if value=\"{{ noEmail }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#9BA593;font-style:italic;\">Fill in a field to build your draft prompt.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n        <button class=\"cpbtn no-print\" style=\"margin-top:12px;width:100%;\" data-key=\"email\" data-text=\"{{ builtEmail }}\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px;padding-top:24px;border-top:1px solid #E4E6DE;\">\n      <div class=\"kicker\">MEETINGS + NOTES<\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin:6px 0 14px;\">Turn messy notes into decisions, actions, owners and deadlines — nothing invented.<\u002Fp>\n      <div class=\"ref\">Turn these meeting notes into: key decisions, action items, who owns each action, deadlines mentioned, unresolved questions and follow-ups. Do not invent missing owners or deadlines. Mark them as not confirmed.<\u002Fdiv>\n      <button class=\"cpbtn no-print\" style=\"margin-top:14px;\" data-key=\"meetingnotes\" data-text=\"Turn these meeting notes into: key decisions, action items, who owns each action, deadlines mentioned, unresolved questions and follow-ups. Do not invent missing owners or deadlines. Mark them as not confirmed.\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 7 BUSINESS -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">AI FOR YOUR SMALL BUSINESS<\u002Fdiv>\n    <h2 class=\"h2\">Where is your business wasting your time?<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin-bottom:16px;\">Look for repeated questions, admin you avoid, enquiries that get stuck and work that pulls you away from paid tasks.<\u002Fp>\n    <div class=\"lbl\">THE THREE BIGGEST TIME DRAINS IN MY BUSINESS<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\">\n      <input type=\"text\" class=\"fld\" data-key=\"biz_drain1\" value=\"{{ answers.biz_drain1 }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"1.\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n      <input type=\"text\" class=\"fld\" data-key=\"biz_drain2\" value=\"{{ answers.biz_drain2 }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"2.\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n      <input type=\"text\" class=\"fld\" data-key=\"biz_drain3\" value=\"{{ answers.biz_drain3 }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"3.\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n    <\u002Fdiv>\n    <div style=\"margin-top:28px;padding-top:24px;border-top:1px solid #E4E6DE;\">\n      <div class=\"kicker\">ENQUIRY ASSISTANT<\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin:6px 0 14px;\">Draft without inventing. Paste a real enquiry below.<\u002Fp>\n      <label style=\"display:block;\"><div class=\"lbl\">PASTE THE ENQUIRY<\u002Fdiv><textarea class=\"fld\" style=\"min-height:70px;\" data-key=\"enquiry_text\" value=\"{{ answers.enquiry_text }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Paste the customer's message…\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea><\u002Flabel>\n      <div class=\"lbl\" style=\"margin-top:18px;\">YOUR PROMPT<\u002Fdiv>\n      <div class=\"ref\"><sc-if value=\"{{ hasEnquiry }}\" hint-placeholder-val=\"{{ true }}\">{{ builtEnquiry }}<\u002Fsc-if><sc-if value=\"{{ noEnquiry }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#9BA593;font-style:italic;\">Paste an enquiry to build your prompt.<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n      <button class=\"cpbtn no-print\" style=\"margin-top:12px;\" data-key=\"enquiry\" data-text=\"{{ builtEnquiry }}\" sc-camel-on-click=\"{{ copyText }}\">COPY PROMPT<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 8 TOOLKIT -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">BUILD YOUR PERSONAL AI TOOLKIT<\u002Fdiv>\n    <h2 class=\"h2\">Your five helpers. Save what works.<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin-bottom:24px;\">Write the five prompts you want to keep and reuse. Give each one a simple name so you can find it again.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:16px;\">\n      <sc-for list=\"{{ helperMeta }}\" as=\"h\" hint-placeholder-count=\"5\">\n        <div style=\"padding:18px 20px;border-radius:12px;background:#EEF1EA;border-left:4px solid {{ h.bar }};\">\n          <div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.12em;color:#3F4D3A;\">{{ h.number }} {{ h.suggestion }}<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 2fr auto;gap:12px;margin-top:10px;align-items:start;\">\n            <input type=\"text\" class=\"fld\" data-key=\"{{ h.nameKey }}\" value=\"{{ h.nameVal }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Name it\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\">\n            <textarea class=\"fld\" style=\"min-height:44px;\" data-key=\"{{ h.promptKey }}\" value=\"{{ h.promptVal }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"The prompt or workflow to save\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Ftextarea>\n            <button class=\"cpbtn no-print\" data-key=\"{{ h.copyKey }}\" data-text=\"{{ h.promptVal }}\" sc-camel-on-click=\"{{ copyText }}\">COPY<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 9 AI-POWERED WEEK -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">YOUR AI-POWERED WEEK<\u002Fdiv>\n    <h2 class=\"h2\">7-day challenge. One real task each day.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:10px;\">\n      <label style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid #E0E2D8;border-radius:10px;background:#F6F6F4;cursor:pointer;font-size:15px;color:#3F4D3A;\"><input type=\"checkbox\" data-key=\"challenge_montue\" checked=\"{{ answers.challenge_montue }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width:18px;height:18px;accent-color:#3F4D3A;flex:none;\"><span><strong>Mon + Tue —<\u002Fstrong> Brain dump your week. Then plan meals and groceries.<\u002Fspan><\u002Flabel>\n      <label style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid #E0E2D8;border-radius:10px;background:#F6F6F4;cursor:pointer;font-size:15px;color:#3F4D3A;\"><input type=\"checkbox\" data-key=\"challenge_wedthu\" checked=\"{{ answers.challenge_wedthu }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width:18px;height:18px;accent-color:#3F4D3A;flex:none;\"><span><strong>Wed + Thu —<\u002Fstrong> Fix one annoying work task. Draft something you've been avoiding.<\u002Fspan><\u002Flabel>\n      <label style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid #E0E2D8;border-radius:10px;background:#F6F6F4;cursor:pointer;font-size:15px;color:#3F4D3A;\"><input type=\"checkbox\" data-key=\"challenge_fri\" checked=\"{{ answers.challenge_fri }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width:18px;height:18px;accent-color:#3F4D3A;flex:none;\"><span><strong>Fri —<\u002Fstrong> Review what saved time and save the useful prompt.<\u002Fspan><\u002Flabel>\n      <label style=\"display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid #E0E2D8;border-radius:10px;background:#F6F6F4;cursor:pointer;font-size:15px;color:#3F4D3A;\"><input type=\"checkbox\" data-key=\"challenge_weekend\" checked=\"{{ answers.challenge_weekend }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width:18px;height:18px;accent-color:#3F4D3A;flex:none;\"><span><strong>Weekend —<\u002Fstrong> Build one reusable AI routine for next week.<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px;padding-top:24px;border-top:1px solid #E4E6DE;\">\n      <div class=\"kicker\">MEASURE THE WIN<\u002Fdiv>\n      <p style=\"font-size:15px;line-height:1.7;color:#5C6653;max-width:640px;margin:6px 0 16px;\">Time saved is the metric. Judge AI by whether the finished task was faster, easier or less exhausting.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;\">\n        <label style=\"display:block;\"><div class=\"lbl\">TASK<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"measure_task\" value=\"{{ answers.measure_task }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"What task?\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">NORMALLY TAKES<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"measure_normally\" value=\"{{ answers.measure_normally }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. 40 min\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">WITH AI<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"measure_withai\" value=\"{{ answers.measure_withai }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"e.g. 10 min\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n        <label style=\"display:block;\"><div class=\"lbl\">USE AGAIN?<\u002Fdiv><input type=\"text\" class=\"fld\" data-key=\"measure_again\" value=\"{{ answers.measure_again }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Yes / no\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;#fff&quot;}\"><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 10 30 DAY PLAN -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">30-DAY ACTION PLAN<\u002Fdiv>\n    <h2 class=\"h2\">Keep it ridiculously simple.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;\">\n      <div style=\"padding:20px 22px;border-radius:12px;background:#EEF1EA;border-left:4px solid #819174;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.14em;color:#3F4D3A;\">START<\u002Fdiv><p style=\"font-size:13px;color:#5C6653;margin:6px 0 10px;\">One AI habit I will start using every week.<\u002Fp><textarea class=\"fld\" style=\"min-height:56px;\" data-key=\"action_start\" value=\"{{ answers.action_start }}\" sc-camel-on-change=\"{{ onText }}\" style-focus=\"{&quot;borderColor&quot;:&quot;#819174&quot;}\"><\u002Ftextarea><\u002Fdiv>\n      <div style=\"padding:20px 22px;border-radius:12px;background:#F6EEE9;border-left:4px solid #C46A4A;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.14em;color:#3F4D3A;\">STOP<\u002Fdiv><p style=\"font-size:13px;color:#5C6653;margin:6px 0 10px;\">One task I will stop starting from scratch.<\u002Fp><textarea class=\"fld\" style=\"min-height:56px;\" data-key=\"action_stop\" value=\"{{ answers.action_stop }}\" sc-camel-on-change=\"{{ onText }}\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;}\"><\u002Ftextarea><\u002Fdiv>\n      <div style=\"padding:20px 22px;border-radius:12px;background:#EEF1EA;border-left:4px solid #819174;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.14em;color:#3F4D3A;\">SAVE<\u002Fdiv><p style=\"font-size:13px;color:#5C6653;margin:6px 0 10px;\">One prompt or helper I will keep and improve.<\u002Fp><textarea class=\"fld\" style=\"min-height:56px;\" data-key=\"action_save\" value=\"{{ answers.action_save }}\" sc-camel-on-change=\"{{ onText }}\" style-focus=\"{&quot;borderColor&quot;:&quot;#819174&quot;}\"><\u002Ftextarea><\u002Fdiv>\n      <div style=\"padding:20px 22px;border-radius:12px;background:#F6EEE9;border-left:4px solid #C46A4A;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.14em;color:#3F4D3A;\">TEST<\u002Fdiv><p style=\"font-size:13px;color:#5C6653;margin:6px 0 10px;\">One new use of AI I will experiment with next.<\u002Fp><textarea class=\"fld\" style=\"min-height:56px;\" data-key=\"action_test\" value=\"{{ answers.action_test }}\" sc-camel-on-change=\"{{ onText }}\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;}\"><\u002Ftextarea><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 11 BONUS PROMPTS -->\n  <div class=\"sheet\">\n    <div class=\"kicker\">BONUS<\u002Fdiv>\n    <h2 class=\"h2\">50 AI prompts for real life.<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:10px;\">\n      <div style=\"padding:16px 18px;border-radius:10px;background:#F6F6F4;border:1px solid #E4E6DE;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.12em;color:#C46A4A;margin-bottom:6px;\">HOME + FAMILY<\u002Fdiv><div style=\"font-size:14px;line-height:1.8;color:#5C6653;\">Plan five dinners around these ingredients… • Turn this meal plan into one shopping list… • Give me a 30-minute house reset… • Build five school lunchboxes… • Create a packing list for… • Help me plan this birthday within $___… • Use these ingredients before they spoil… • Break this household job into 15-minute tasks… • Help me choose a gift for… • Turn this school note into actions and dates…<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px;border-radius:10px;background:#F6F6F4;border:1px solid #E4E6DE;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.12em;color:#C46A4A;margin-bottom:6px;\">MENTAL LOAD<\u002Fdiv><div style=\"font-size:14px;line-height:1.8;color:#5C6653;\">Organise this brain dump… • Tell me my three priorities… • I have 15 minutes. Tell me what to do… • Build a realistic week around these commitments… • What can I delegate from this list? • Help me decide between these options… • Turn this information into a checklist… • What am I forgetting? • Create a Sunday reset routine… • Make this plan less overwhelming…<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px;border-radius:10px;background:#F6F6F4;border:1px solid #E4E6DE;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.12em;color:#C46A4A;margin-bottom:6px;\">WORK + ADMIN<\u002Fdiv><div style=\"font-size:14px;line-height:1.8;color:#5C6653;\">Draft this email… • Make this email warmer and shorter… • Summarise this into actions and deadlines… • Turn these meeting notes into tasks… • Prepare me for this meeting… • Explain this in plain English… • Edit this without changing my voice… • Build the structure before writing the document… • Explain why this spreadsheet formula isn't working… • Challenge my approach and suggest a simpler option…<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px;border-radius:10px;background:#F6F6F4;border:1px solid #E4E6DE;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.12em;color:#C46A4A;margin-bottom:6px;\">SMALL BUSINESS<\u002Fdiv><div style=\"font-size:14px;line-height:1.8;color:#5C6653;\">Reply to this enquiry without inventing facts… • What information is missing from this quote request? • Turn this process into an SOP… • Create FAQs from these repeated questions… • Draft a polite follow-up… • Repurpose this into five content ideas… • Review these customer comments for patterns… • What repetitive tasks should I systemise first? • Create a client onboarding checklist… • Audit where my time is disappearing…<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:16px 18px;border-radius:10px;background:#F6F6F4;border:1px solid #E4E6DE;\"><div style=\"font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:.12em;color:#C46A4A;margin-bottom:6px;\">CONTENT + MARKETING<\u002Fdiv><div style=\"font-size:14px;line-height:1.8;color:#5C6653;\">Turn this idea into three posts… • Give me ten hooks for this audience… • Rewrite this so it sounds like me… • Turn this testimonial into social proof content… • Create a week's content from this one topic… • Give me five non-cringey calls to action… • Turn this voice note into a caption… • Challenge this offer from the customer's perspective… • Make this clearer for a complete beginner… • What questions is my audience already asking?<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CLOSING -->\n  <div class=\"sheet\" style=\"background:#3F4D3A;color:#F6F6F4;padding:56px 56px 50px;\">\n    <div class=\"kicker\" style=\"color:#CBD5C5;\">ONE LAST THING<\u002Fdiv>\n    <h2 style=\"font-family:'Playfair Display';font-style:italic;font-size:30px;color:#fff;margin:6px 0 14px;\">Keep the human part.<\u002Fh2>\n    <p style=\"font-size:15px;line-height:1.75;color:#CBD5C5;max-width:620px;margin:0 0 24px;\">AI is most useful when it takes some of the repetitive thinking, drafting and organising off your plate, while you keep the judgement, relationships, experience and decisions that actually need you. Start with one task. Save what works. Improve it next time.<\u002Fp>\n    <label style=\"display:block;\"><div style=\"font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.14em;color:#CBD5C5;margin-bottom:10px;\">BEFORE NEXT WEEK, I WILL…<\u002Fdiv><textarea data-key=\"smallStep\" value=\"{{ answers.smallStep }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"One small, doable thing.\" style=\"width:100%;min-height:70px;background:rgba(255,255,255,.08);border:1.5px solid rgba(203,213,197,.4);border-radius:10px;padding:14px 16px;font-size:16px;line-height:1.6;color:#fff;outline:none;\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;,&quot;background&quot;:&quot;rgba(255,255,255,.12)&quot;}\"><\u002Ftextarea><\u002Flabel>\n    <label style=\"display:flex;align-items:center;gap:14px;margin-top:22px;cursor:pointer;padding:16px 18px;border-radius:10px;background:rgba(196,106,74,.15);border:1.5px solid rgba(196,106,74,.5);\">\n      <input type=\"checkbox\" data-key=\"commit\" checked=\"{{ answers.commit }}\" sc-camel-on-change=\"{{ onToggle }}\" style=\"width:20px;height:20px;accent-color:#C46A4A;flex:none;\">\n      <span style=\"font-size:15px;color:#fff;\">I'm committing to trying this — done beats perfect.<\u002Fspan>\n    <\u002Flabel>\n    <div style=\"display:flex;gap:22px;margin-top:26px;flex-wrap:wrap;align-items:flex-end;\">\n      <label style=\"flex:2;min-width:200px;\"><div style=\"font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.14em;color:#CBD5C5;margin-bottom:8px;\">SIGNED<\u002Fdiv><input type=\"text\" data-key=\"signature\" value=\"{{ answers.signature }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"Your name\" style=\"width:100%;background:transparent;border:none;border-bottom:1.5px solid rgba(203,213,197,.5);padding:8px 2px;font-family:'Playfair Display';font-style:italic;font-size:24px;color:#fff;outline:none;\" style-focus=\"{&quot;borderColor&quot;:&quot;#C46A4A&quot;}\"><\u002Flabel>\n      <div style=\"flex:1;min-width:160px;font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.16em;color:#819174;text-align:right;padding-bottom:10px;\">SAVE TIME · GROW INCOME<br>· LIGHTEN THE LOAD<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"text-align:center;padding:8px 0 0;font-family:'Montserrat';font-weight:600;font-size:11px;letter-spacing:.24em;color:#9BA593;\">COUNTRY SMART AI · @COUNTRYSMART.AI<\u002Fdiv>\n\n  <sc-if value=\"{{ showToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"no-print\" style=\"position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#3F4D3A;color:#fff;font-family:'Montserrat';font-weight:600;font-size:13px;letter-spacing:.06em;padding:12px 24px;border-radius:99px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:100;\">Copied to clipboard ✓<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Terracotta&quot;,&quot;options&quot;:[&quot;Terracotta&quot;,&quot;Green&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;}}\">\nclass Component extends DCLogic {\n  defaults() {\n    return {\n      name:'', date:'',\n      quickwin_reflection:'',\n      formula_context:'', formula_task:'', formula_details:'', formula_result:'',\n      about_household:'', about_work:'', about_goals:'', about_pressures:'', about_prefs:'',\n      mentalload_dump:'', priority1:'', priority2:'', priority3:'',\n      dinner_adults:'', dinner_children:'', dinner_time:'', dinner_ingredients:'', dinner_dietary:'', dinner_effort:'low',\n      email_situation:'', email_recipient:'', email_outcome:'', email_tone:'warm', email_details:'',\n      biz_drain1:'', biz_drain2:'', biz_drain3:'',\n      enquiry_text:'',\n      helper1_name:'', helper1_prompt:'', helper2_name:'', helper2_prompt:'', helper3_name:'', helper3_prompt:'', helper4_name:'', helper4_prompt:'', helper5_name:'', helper5_prompt:'',\n      challenge_montue:false, challenge_wedthu:false, challenge_fri:false, challenge_weekend:false,\n      measure_task:'', measure_normally:'', measure_withai:'', measure_again:'',\n      action_start:'', action_stop:'', action_save:'', action_test:'',\n      smallStep:'', commit:false, signature:''\n    };\n  }\n  state = { answers: this.defaults(), showToast:false };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('csai_reallife_workbook_v1');\n      if (raw) this.setState({ answers: { ...this.state.answers, ...JSON.parse(raw) } });\n    } catch(e) {}\n  }\n  persist(a) { try { localStorage.setItem('csai_reallife_workbook_v1', JSON.stringify(a)); } catch(e) {} }\n\n  onText = (e) => { const a = { ...this.state.answers, [e.target.dataset.key]: e.target.value }; this.persist(a); this.setState({ answers:a }); };\n  onToggle = (e) => { const a = { ...this.state.answers, [e.target.dataset.key]: e.target.checked }; this.persist(a); this.setState({ answers:a }); };\n\n  copyText = (e) => {\n    const t = e.currentTarget.dataset.text || '';\n    if (!t.trim()) return;\n    try { navigator.clipboard.writeText(t); } catch(err) {}\n    this.setState({ showToast:true });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ showToast:false }), 1600);\n  };\n\n  print = () => window.print();\n  reset = () => {\n    if (!confirm('Clear all your answers and start fresh?')) return;\n    const d = this.defaults();\n    this.persist(d);\n    this.setState({ answers:d });\n  };\n\n  buildFormula(a) {\n    const lines = [];\n    if (a.formula_context.trim()) lines.push('Context: ' + a.formula_context.trim() + '.');\n    if (a.formula_task.trim())    lines.push('Task: ' + a.formula_task.trim() + '.');\n    if (a.formula_details.trim()) lines.push('Details: ' + a.formula_details.trim() + '.');\n    if (a.formula_result.trim())  lines.push('Result: ' + a.formula_result.trim() + '.');\n    return lines.join('\\n');\n  }\n  buildAboutMe(a) {\n    const lines = [];\n    if (a.about_household.trim()) lines.push('Household & family: ' + a.about_household.trim());\n    if (a.about_work.trim())      lines.push('Work & weekly commitments: ' + a.about_work.trim());\n    if (a.about_goals.trim())     lines.push('Goals: ' + a.about_goals.trim());\n    if (a.about_pressures.trim()) lines.push('Biggest time pressures: ' + a.about_pressures.trim());\n    if (a.about_prefs.trim())     lines.push('Preferences: ' + a.about_prefs.trim());\n    if (!lines.length) return '';\n    return 'Here is my About Me profile — please keep this in mind for anything you help me with:\\n\\n' + lines.join('\\n');\n  }\n  buildDinner(a) {\n    if (![a.dinner_adults,a.dinner_children,a.dinner_time,a.dinner_ingredients,a.dinner_dietary].some(v=>v && v.trim())) return '';\n    return 'Help me work out dinner tonight. Number of adults: ' + (a.dinner_adults||'___') + '. Children: ' + (a.dinner_children||'___') + '. Time to cook: ' + (a.dinner_time||'___') + '. Ingredients I already have: ' + (a.dinner_ingredients||'___') + '. Dietary needs: ' + (a.dinner_dietary||'___') + '. Effort level: ' + a.dinner_effort + '. Give me three realistic options, recommend the easiest, then give me simple instructions.';\n  }\n  buildEmail(a) {\n    if (![a.email_situation,a.email_recipient,a.email_outcome,a.email_details].some(v=>v && v.trim())) return '';\n    return 'Help me write an email. Situation: ' + (a.email_situation||'___') + '. Recipient: ' + (a.email_recipient||'___') + '. Outcome I need: ' + (a.email_outcome||'___') + '. Tone: ' + a.email_tone + '. Important details: ' + (a.email_details||'___') + '. Draft it in natural language. Don\\'t make it overly formal or use corporate jargon.';\n  }\n  buildEnquiry(a) {\n    if (!a.enquiry_text.trim()) return '';\n    return 'Help me respond to this customer enquiry. First identify what information they\\'ve already provided. Identify only the essential information still missing. Do not invent pricing, availability, policies, services, inclusions or promises. Draft a warm concise response asking only the necessary questions. Here is the enquiry: ' + a.enquiry_text.trim();\n  }\n\n  renderVals() {\n    const a = this.state.answers;\n    const accentColor = (this.props.accent === 'Green') ? '#3F4D3A' : '#C46A4A';\n\n    const builtFormula = this.buildFormula(a);\n    const builtAboutMe = this.buildAboutMe(a);\n    const builtDinner = this.buildDinner(a);\n    const builtEmail = this.buildEmail(a);\n    const builtEnquiry = this.buildEnquiry(a);\n\n    const helperSuggestions = [\n      {n:'01', s:'MENTAL LOAD — brain dump → priorities → realistic plan', bar:'#819174'},\n      {n:'02', s:'WEEKLY PLAN — appointments + work + family → one useful week', bar:'#C46A4A'},\n      {n:'03', s:'HOME HELPER — meals, groceries, cleaning, packing or family admin', bar:'#819174'},\n      {n:'04', s:'WORK ASSISTANT — emails, summaries, meeting prep or repetitive admin', bar:'#C46A4A'},\n      {n:'05', s:'BUSINESS HELPER — the repeated task that keeps stealing your time', bar:'#819174'}\n    ];\n    const helperMeta = helperSuggestions.map((h,i) => ({\n      number: h.n, suggestion: h.s, bar: h.bar,\n      nameKey: 'helper' + (i+1) + '_name', nameVal: a['helper' + (i+1) + '_name'],\n      promptKey: 'helper' + (i+1) + '_prompt', promptVal: a['helper' + (i+1) + '_prompt'],\n      copyKey: 'helper' + (i+1)\n    }));\n\n    const milestones = [\n      !!a.name.trim(), !!a.quickwin_reflection.trim(), !!builtFormula.trim(), !!builtAboutMe.trim(),\n      !!(a.priority1.trim()||a.priority2.trim()||a.priority3.trim()), !!builtDinner.trim(), !!builtEmail.trim(),\n      !!(a.biz_drain1.trim()||a.biz_drain2.trim()||a.biz_drain3.trim()),\n      !!(a.helper1_prompt.trim()||a.helper2_prompt.trim()||a.helper3_prompt.trim()||a.helper4_prompt.trim()||a.helper5_prompt.trim()),\n      !!(a.action_start.trim()||a.action_stop.trim()||a.action_save.trim()||a.action_test.trim()),\n      !!a.smallStep.trim()\n    ];\n    const done = milestones.filter(Boolean).length;\n    const progressPct = Math.round((done / milestones.length) * 100);\n\n    return {\n      answers: a, accentColor,\n      onText: this.onText, onToggle: this.onToggle, copyText: this.copyText,\n      print: this.print, reset: this.reset,\n      builtFormula, hasFormula: !!builtFormula.trim(), noFormula: !builtFormula.trim(),\n      builtAboutMe, hasAboutMe: !!builtAboutMe.trim(), noAboutMe: !builtAboutMe.trim(),\n      builtDinner, hasDinner: !!builtDinner.trim(), noDinner: !builtDinner.trim(),\n      builtEmail, hasEmail: !!builtEmail.trim(), noEmail: !builtEmail.trim(),\n      builtEnquiry, hasEnquiry: !!builtEnquiry.trim(), noEnquiry: !builtEnquiry.trim(),\n      helperMeta,\n      showToast: this.state.showToast,\n      progressPct, progressWidth: progressPct + '%'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
