<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Build Checklist — Country Smart AI</title>
<style>
  :root{
    --ink:#1f2a24;
    --ink-soft:#5a6b62;
    --line:#dfe4e0;
    --bg:#f6f5f1;
    --card:#ffffff;
    --green:#2f5d4a;
    --green-soft:#e8f0eb;
    --sand:#c8a56a;
    --warn-bg:#fdf6e7;
    --warn-line:#e6cf9c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:0 1rem 4rem;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:820px;margin:0 auto;}

  header{padding:2.5rem 0 1.25rem;}
  .eyebrow{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sand);font-weight:700;margin:0 0 .4rem;
  }
  h1{margin:0 0 .35rem;font-size:1.9rem;line-height:1.15;letter-spacing:-.02em;}
  .sub{margin:0;color:var(--ink-soft);font-size:.95rem;}

  .meta{
    display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1rem;margin:1.25rem 0;
  }
  .meta label{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:.3rem;}
  .meta input{
    width:100%;padding:.5rem .6rem;font:inherit;font-size:.95rem;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  }
  .meta input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}

  .progress-wrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:.75rem 0 .9rem;}
  .bar{height:9px;background:#e4e8e5;border-radius:99px;overflow:hidden;}
  .bar span{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s ease;}
  .bar-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-soft);margin-top:.4rem;}
  .bar-label strong{color:var(--ink);}

  section{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:1.1rem 1.2rem 1.25rem;margin-bottom:1rem;
  }
  section > h2{
    margin:0 0 .15rem;font-size:1.05rem;letter-spacing:-.01em;
    display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;
  }
  .stage-num{
    font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--green);background:var(--green-soft);padding:.2rem .45rem;border-radius:5px;
  }
  .count{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--ink-soft);}
  .blurb{margin:.35rem 0 .9rem;color:var(--ink-soft);font-size:.9rem;}

  ul{list-style:none;margin:0;padding:0;}
  li{border-top:1px solid var(--line);}
  li:first-child{border-top:0;}
  label.task{
    display:flex;gap:.7rem;align-items:flex-start;
    padding:.6rem .2rem;cursor:pointer;
  }
  label.task input{
    appearance:none;-webkit-appearance:none;
    flex:0 0 auto;width:21px;height:21px;margin:1px 0 0;
    border:2px solid #b9c3bd;border-radius:5px;background:#fff;cursor:pointer;
    display:grid;place-content:center;transition:background .12s,border-color .12s;
  }
  label.task input:checked{background:var(--green);border-color:var(--green);}
  label.task input:checked::after{
    content:"";width:11px;height:6px;
    border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px);
  }
  label.task input:focus-visible{outline:2px solid var(--sand);outline-offset:2px;}
  label.task span{font-size:.97rem;}
  label.task input:checked + span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:#b9c3bd;}

  .note{
    background:var(--warn-bg);border:1px solid var(--warn-line);border-left-width:4px;
    border-radius:8px;padding:.7rem .85rem;margin-top:.9rem;
    font-size:.88rem;color:#6b5522;
  }
  .note strong{color:#523f14;}

  .field-row{display:grid;gap:.75rem;grid-template-columns:1fr 1fr;margin-top:.9rem;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}
  .field-row label{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:.3rem;}
  .field-row input,textarea{
    width:100%;padding:.5rem .6rem;font:inherit;font-size:.95rem;
    border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);
  }
  textarea{min-height:90px;resize:vertical;margin-top:.9rem;}

  .actions{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.5rem 0 0;}
  button{
    font:inherit;font-size:.9rem;font-weight:600;padding:.55rem 1rem;
    border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  button:hover{border-color:var(--green);color:var(--green);}
  button.danger:hover{border-color:#b4453c;color:#b4453c;}
  .saved{font-size:.82rem;color:var(--ink-soft);align-self:center;}

  footer{margin-top:2rem;font-size:.82rem;color:var(--ink-soft);text-align:center;}

  @media print{
    body{background:#fff;padding:0;font-size:12px;}
    .progress-wrap,.actions,footer{display:none;}
    section{break-inside:avoid;border:1px solid #ccc;margin-bottom:.5rem;padding:.6rem .8rem;}
    label.task{padding:.25rem 0;}
    label.task input{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    header{padding:1rem 0 .5rem;}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">Country Smart AI</p>
  <h1>Website Build Checklist</h1>
  <p class="sub">One per client. Ticks save automatically in this browser, per client name.</p>
</header>

<div class="meta">
  <div><label for="client">Client</label><input id="client" data-field="client" placeholder="Business name"></div>
  <div><label for="package">Package</label><input id="package" data-field="package" placeholder="e.g. 5-page starter"></div>
  <div><label for="start">Start date</label><input id="start" data-field="start" type="date"></div>
  <div><label for="preview">Preview due</label><input id="preview" data-field="preview" type="date"></div>
  <div><label for="launch">Launch due</label><input id="launch" data-field="launch" type="date"></div>
</div>

<div class="progress-wrap">
  <div class="bar"><span id="barFill"></span></div>
  <div class="bar-label"><span id="barText">0 of 0 done</span><strong id="barPct">0%</strong></div>
</div>

<main id="board"></main>

<div class="actions">
  <button type="button" onclick="window.print()">Print / save as PDF</button>
  <button type="button" class="danger" id="resetBtn">Reset this client</button>
  <span class="saved" id="savedNote"></span>
</div>

<footer>Country Smart AI — internal build SOP</footer>

</div>

<script>
const STAGES = [
  {
    num: "Stage 1", title: "Enquiry",
    blurb: "Nothing starts until the deposit is in.",
    items: ["Enquiry received","Package confirmed","Scope confirmed","Price approved",
            "Deposit invoice sent","50% deposit paid","Intake form sent"],
    note: "Sending the intake form is the reward for paying the deposit, not the thing that gets them to pay it."
  },
  {
    num: "Stage 2", title: "Content collection",
    items: ["Intake form completed","Logo received","Brand colours confirmed","Photos received",
            "Services / menu received","Contact details confirmed","Social links collected",
            "Testimonials collected","Domain details confirmed","Missing information requested"],
    note: "<strong>Do not start building until this stage is mostly complete.</strong> Building around placeholder content means building twice. If you are waiting on something, send one clear chase listing everything outstanding."
  },
  {
    num: "Stage 3", title: "Planning",
    items: ["Confirm page structure","Decide primary call-to-action","Create site map",
            "Draft website copy","Client approves key messaging (if needed)"],
    fields: [{key:"cta",label:"Primary call-to-action"},{key:"pages",label:"Page count"}],
    textarea: {key:"sitemap", label:"Site map", placeholder:"Home\nAbout\nServices\nGallery\nContact"},
    note: "Everything on the site points at the primary call-to-action. If a section does not help someone call, enquire, book, buy, visit or follow, ask what it is doing there."
  },
  {
    num: "Stage 4", title: "Build",
    items: ["Create website","Add branding","Build navigation","Build homepage","Build remaining pages",
            "Add forms","Add social links","Add map","Add reviews / testimonials","Optimise images",
            "Check mobile layout"]
  },
  {
    num: "Stage 5", title: "SEO basics",
    items: ["Page titles added","Meta descriptions added","Business name and location included naturally",
            "Image alt text added","Heading structure checked","Google Business Profile linked (if relevant)"],
    note: "Call this <strong>basic on-page SEO setup</strong> in your package wording. Do not promise rankings or ongoing optimisation at this price point."
  },
  {
    num: "Quality control", title: "Before the client sees it",
    blurb: "Work through this on a real phone, not just a resized browser window.",
    items: ["Test every button","Test contact form (submit it, confirm the email lands)",
            "Test phone links (tap on a phone, confirm it dials)","Test email links","Check spelling",
            "Check pricing","Check addresses","Check desktop","Check mobile","Check tablet",
            "Check loading speed","Check social links","Check navigation",
            "Remove placeholder text and images","Favicon and logo appear correctly"]
  },
  {
    num: "Revisions", title: "One revision round",
    items: ["Preview link sent","Revision form link sent with it","Client given a clear review deadline",
            "All changes received through the form","Changes worked through","Updated preview sent",
            "Revision round closed"],
    note: "One place to submit changes. Not a text today, an email tomorrow and their neighbour's opinion on Sunday night. Further changes after the round closes are quoted separately - say so kindly and early."
  },
  {
    num: "Launch", title: "Go live",
    items: ["Revision completed","Client approval received","Final invoice sent","Final payment received",
            "Domain connected","Website published","SSL active (padlock showing, http redirects to https)",
            "Contact form tested again on the live site","Google Analytics added (if included)",
            "Google Search Console added (if included)","Client sent login and handover information",
            "Client asked for a testimonial","Portfolio screenshots saved","Before / after case study created"],
    note: "Test the contact form <strong>again</strong> after launch. Forms that worked on the preview URL are the most common thing to break when the domain is connected."
  },
  {
    num: "+7 days", title: "Post-launch check",
    blurb: "Diary it for one week after launch.",
    items: ["Site is working","Enquiry form tested","Any minor launch issues fixed","Review / testimonial requested"],
    note: "A lovely client experience without promising endless support. A defined check-in with an end date, not an open door."
  }
];

const board = document.getElementById('board');
const meta = document.querySelectorAll('.meta input');
let state = {};

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function storeKey(){
  const c = document.getElementById('client').value.trim();
  return 'csai-checklist:' + (c ? slug(c) : 'untitled');
}

function render(){
  board.innerHTML = '';
  STAGES.forEach((stage, si) => {
    const sec = document.createElement('section');
    const h = document.createElement('h2');
    h.innerHTML = '<span class="stage-num">' + stage.num + '</span>' + stage.title +
                  '<span class="count" data-count="' + si + '"></span>';
    sec.appendChild(h);

    if (stage.blurb){
      const p = document.createElement('p');
      p.className = 'blurb'; p.textContent = stage.blurb;
      sec.appendChild(p);
    }

    const ul = document.createElement('ul');
    stage.items.forEach((item, ii) => {
      const id = si + '.' + ii;
      const li = document.createElement('li');
      const label = document.createElement('label');
      label.className = 'task';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.dataset.id = id;
      cb.checked = !!state.ticks?.[id];
      cb.addEventListener('change', () => {
        state.ticks = state.ticks || {};
        state.ticks[id] = cb.checked;
        save(); updateCounts();
      });
      const span = document.createElement('span');
      span.textContent = item;
      label.appendChild(cb); label.appendChild(span);
      li.appendChild(label); ul.appendChild(li);
    });
    sec.appendChild(ul);

    if (stage.fields){
      const row = document.createElement('div');
      row.className = 'field-row';
      stage.fields.forEach(f => {
        const d = document.createElement('div');
        const l = document.createElement('label'); l.textContent = f.label; l.htmlFor = 'f-' + f.key;
        const inp = document.createElement('input');
        inp.id = 'f-' + f.key; inp.dataset.field = f.key;
        inp.value = state.fields?.[f.key] || '';
        inp.addEventListener('input', () => { setField(f.key, inp.value); });
        d.appendChild(l); d.appendChild(inp); row.appendChild(d);
      });
      sec.appendChild(row);
    }

    if (stage.textarea){
      const ta = document.createElement('textarea');
      ta.placeholder = stage.textarea.placeholder || '';
      ta.setAttribute('aria-label', stage.textarea.label);
      ta.value = state.fields?.[stage.textarea.key] || '';
      ta.addEventListener('input', () => { setField(stage.textarea.key, ta.value); });
      sec.appendChild(ta);
    }

    if (stage.note){
      const n = document.createElement('div');
      n.className = 'note'; n.innerHTML = stage.note;
      sec.appendChild(n);
    }

    board.appendChild(sec);
  });
  updateCounts();
}

function setField(key, val){
  state.fields = state.fields || {};
  state.fields[key] = val;
  save();
}

function updateCounts(){
  let done = 0, total = 0;
  STAGES.forEach((stage, si) => {
    let d = 0;
    stage.items.forEach((_, ii) => { if (state.ticks?.[si + '.' + ii]) d++; });
    done += d; total += stage.items.length;
    const el = document.querySelector('[data-count="' + si + '"]');
    if (el) el.textContent = d + '/' + stage.items.length;
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('barText').textContent = done + ' of ' + total + ' done';
  document.getElementById('barPct').textContent = pct + '%';
}

let saveTimer;
function save(){
  meta.forEach(i => { state.meta = state.meta || {}; state.meta[i.dataset.field] = i.value; });
  try { localStorage.setItem(storeKey(), JSON.stringify(state)); } catch(e){ return; }
  const note = document.getElementById('savedNote');
  note.textContent = 'Saved';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { note.textContent = ''; }, 1500);
}

function load(){
  let raw = null;
  try { raw = localStorage.getItem(storeKey()); } catch(e){}
  state = raw ? JSON.parse(raw) : {ticks:{}, fields:{}, meta:{}};
  meta.forEach(i => {
    if (i.dataset.field !== 'client') i.value = state.meta?.[i.dataset.field] || '';
  });
  render();
}

meta.forEach(i => {
  i.addEventListener('input', () => {
    if (i.dataset.field === 'client') { load(); } else { save(); }
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  const name = document.getElementById('client').value.trim() || 'this untitled checklist';
  if (!confirm('Clear every tick and note for ' + name + '? This cannot be undone.')) return;
  try { localStorage.removeItem(storeKey()); } catch(e){}
  load();
});

load();
</script>
</body>
</html>
